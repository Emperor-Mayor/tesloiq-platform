<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Tesloiq</title>
  <meta name="description" content="Tesloiq - Innovation-Driven Investment Committee">
  <link rel="icon" type="image/svg+xml" href="./images/tlogo.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aquawolf04/font-awesome-pro@5cd1511/css/all.css">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',DEFAULT:'#6366f1',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',foreground:'#ffffff' },
            secondary: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',DEFAULT:'#64748b',500:'#64748b',600:'#475569',700:'#334155',foreground:'#0f172a' },
            accent: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',DEFAULT:'#10b981',500:'#10b981',600:'#059669',700:'#047857',foreground:'#ffffff' },
          },
          boxShadow: { 'soft': '0 2px 15px -3px rgba(0,0,0,0.07), 0 10px 20px -2px rgba(0,0,0,0.04)' },
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>

  <!-- html2canvas for receipt sharing -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .dark ::-webkit-scrollbar-track { background: #374151; }
    .dark ::-webkit-scrollbar-thumb { background: #6b7280; }
  </style>

  <script>
    (function() {
      if (localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <!-- Live Chat: add your own widget here -->
</head>

<body class="bg-white dark:bg-black min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <img src="./images/tlogo.svg" alt="T" class="w-10 h-10 object-contain mb-4 dark:hidden">
      <img src="./images/tlogo-white.svg" alt="T" class="w-10 h-10 object-contain mb-4 hidden dark:block">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Teslo<span class="text-slate-500">IQ</span></h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Investment Committee Registration</p>
    </div>

    <!-- Card -->
    <div class="bg-white dark:bg-white/[0.03] rounded-2xl shadow-soft border border-gray-200 dark:border-white/5 p-8">
      <form method="POST" action="#" onsubmit="redirectToDashboard(event)" class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">First Name</label>
            <input type="text" name="first_name" required placeholder="John"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-white/[0.05] text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-slate-500 focus:border-transparent transition-all">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
            <input type="text" name="last_name" required placeholder="Doe"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-white/[0.05] text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-slate-500 focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-envelope text-gray-400 text-sm"></i>
            </div>
            <input type="email" name="email" required placeholder="john@example.com"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-white/[0.05] text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-slate-500 focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Phone Number</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-phone text-gray-400 text-sm"></i>
            </div>
            <input type="tel" name="phone" required placeholder="+1 (555) 000-0000"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-white/[0.05] text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-slate-500 focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
            </div>
            <input type="password" name="password" required minlength="8" placeholder="Min. 8 characters"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 dark:border-white/5 bg-gray-50 dark:bg-white/[0.05] text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-slate-500 focus:border-transparent transition-all">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-slate-500 to-slate-600 text-white font-semibold rounded-xl shadow-lg shadow-slate-500/25 hover:shadow-xl hover:shadow-slate-500/30 transition-all text-sm">
          Create Account
        </button>
      </form>
    </div>

    <div class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6 space-y-3">
      <p>
        <a href="/" class="text-slate-500 font-semibold hover:text-slate-600">← Back to Home</a>
      </p>
      <p>
        Already have an account?
        <a href="./Sign_In.html" class="text-slate-500 font-semibold hover:text-slate-600">Sign In</a>
      </p>
    </div>
  </div>

  <script>
  function redirectToDashboard(event) {
    event.preventDefault();
    
    const firstName = document.querySelector('input[name="first_name"]').value;
    const lastName = document.querySelector('input[name="last_name"]').value;
    const email = document.querySelector('input[name="email"]').value;
    const phone = document.querySelector('input[name="phone"]').value;
    const password = document.querySelector('input[name="password"]').value;
    
    if (firstName && lastName && email && phone && password) {
      alert('Account created successfully! Please sign in to access your dashboard.');
      setTimeout(() => {
        window.location.href = './Sign_In.html';  // ✅ 
      }, 1000);
    } else {
      alert('Please fill in all fields');
    }
  }
</script>
  <script src="//code.jivosite.com/widget/2RUwjV75YI" async></script>
</body>
</html>
