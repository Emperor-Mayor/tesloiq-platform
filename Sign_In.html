<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Tesloiq</title>
  <meta name="description" content="Tesloiq - Innovation-Driven Investment Committee">
  <link rel="icon" type="image/svg+xml" href="./images/tlogo.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aquawolf04/font-awesome-pro@5cd1511/css/all.css">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',DEFAULT:'#6366f1',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',foreground:'#ffffff' },
            secondary: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',DEFAULT:'#64748b',500:'#64748b',600:'#475569',700:'#334155',foreground:'#0f172a' },
            accent: { 50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',DEFAULT:'#10b981',500:'#10b981',600:'#059669',700:'#047857',foreground:'#ffffff' },
          },
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #060810; }
  </style>
</head>

<body class="bg-[#060810] text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#0c0f18] p-8 rounded-2xl border border-white/5 shadow-2xl" x-data="loginForm()">
    <!-- Logo -->
    <div class="text-center mb-8">
      <img src="./images/tlogo.svg" alt="Tesloiq" class="w-12 h-12 mx-auto mb-3 opacity-80" onerror="this.src='https://via.placeholder.com/48?text=T'">
      <h2 class="text-2xl font-black tracking-tight">Teslo<span class="text-[#6488a8]">IQ</span></h2>
      <p class="text-xs text-white/40 mt-1">Sign in to your committee account</p>
    </div>

    <!-- Sign-In Form Framework -->
    <form @submit.prevent="submitLogin">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-1">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-white/30"><i class="fas fa-envelope"></i></span>
            <input type="email" x-model="email" required placeholder="john@example.com" class="w-full bg-[#141824] border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-[#6488a8] focus:ring-0 text-white placeholder-white/20">
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-white/30"><i class="fas fa-lock"></i></span>
            <input type="password" x-model="password" required placeholder="Enter your password" class="w-full bg-[#141824] border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-[#6488a8] focus:ring-0 text-white placeholder-white/20">
          </div>
        </div>
      </div>

      <button type="submit" class="w-full mt-6 bg-[#6488a8] hover:bg-[#7a9bb5] text-[#060810] font-bold text-xs uppercase tracking-widest py-4 rounded-xl transition-all shadow-lg" x-text="loading ? 'Authenticating...' : 'Sign In'"></button>
    </form>

    <div class="text-center mt-6 space-y-2">
      <p class="text-xs text-white/30"><a href="./index.html" class="hover:text-white transition-colors">← Back to Home</a></p>
      <p class="text-xs text-white/30">Don't have an account? <a href="./Register.html" class="text-[#6488a8] hover:underline font-medium">Register</a></p>
    </div>
  </div>

  <script>
    function loginForm() {
      return {
        email: '',
        password: '',
        loading: false,
        async submitLogin() {
          this.loading = true;
          try {
            const res = await fetch('https://tesloiq.onrender.com/api/login', { 
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: this.email, password: this.password })
            });
            
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || "Invalid credentials sequence.");
            
            // Save required session & user tokens locally
            const token = data.token || data.authToken || data.userId || data._id;
            localStorage.setItem('authToken', token);
            localStorage.setItem('userId', data.userId || data._id);
            localStorage.setItem('userEmail', data.email);
            localStorage.setItem('userName', data.name);
            
            // Redirect to dashboard
            window.location.replace("./dashboard.html");
          } catch(err) {
            alert(err.message);
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
